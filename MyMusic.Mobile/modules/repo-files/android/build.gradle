plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mymusic.repofiles'
version = '1.0.0'

android {
  namespace "com.mymusic.repofiles"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Same version expo-file-system ships, so the app keeps a single OkHttp
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
