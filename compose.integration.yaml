name: my-music-integration-tests

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: my-music
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my-music"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  server:
    image: gitea.home/silvas/my-music:${VERSION:-dev}
    environment:
      MYMUSIC_HEADER_ID_ENABLED: "1"
      ConnectionStrings__Postgres: "Host=db;Port=5432;Username=postgres;Password=postgres;Database=my-music"
      OpenTelemetry__Enabled: "true"
      OpenTelemetry__Protocol: "http/protobuf"
      OpenTelemetry__Endpoint: "${OTELITE_ENDPOINT:-http://otelite:4318}"
      Logging__LogLevel__MyMusic: "Debug"
    depends_on:
      db:
        condition: service_healthy
      otelite:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The server only starts listening after the migrations ran, so a successful ping means it is ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  client:
    image: gitea.home/silvas/my-music-ui:${VERSION:-dev}

  caddy:
    image: caddy:2
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - server
      - client
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  integration-tests:
    image: gitea.home/silvas/my-music-integrations-tests:${VERSION:-dev}
    environment:
      OpenTelemetry__Enabled: "true"
      OpenTelemetry__Protocol: "http/protobuf"
      OpenTelemetry__Endpoint: "${OTELITE_ENDPOINT:-http://otelite:4318}"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
      caddy:
        condition: service_healthy
      otelite:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Opt-in telemetry collector: enable with `--profile otelite`
  otelite:
    image: ghcr.io/pedromsilvapt/otelite:latest
    profiles: [otelite]
    volumes:
      - otelite-data:/data

volumes:
  postgres-data: {}
  otelite-data: {}

configs:
  caddyfile:
    content: |
      :80 {
        handle_path /api/* {
          reverse_proxy server:8080
        }

        handle /* {
          reverse_proxy client:8080
        }
      }
